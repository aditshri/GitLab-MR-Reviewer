general:
  team_name: "Payment Stream"
  enabled_categories:
    - code_quality
    - security
    - testing

security:
  strict_mode: true
  pci_dss:
    - Never log full PANs, CVVs, authentication data, or payment secrets.
    - Protect cardholder data in transit and at rest using approved encryption.
    - Validate authorization boundaries for payment, refund, and settlement flows.
    - Reject sensitive data in error messages, traces, and audit logs.

testing:
  min_coverage_percent: 70
  payment_scenarios:
    - Cover duplicate submissions and idempotency behavior.
    - Test declined, partially authorized, refunded, and timed-out transactions.

output:
  include_positive_feedback: true
  severity_levels:
    - critical
    - high
    - medium
    - low

ai_behavior:
  tone: constructive
  detail_level: comprehensive
  suggest_improvements: true